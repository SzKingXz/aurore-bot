openapi: 3.0.3
info:
  title: AURORE API
  version: 4.0.0
  description: |
    API REST del bot AURORE. Todos los endpoints requieren autenticación mediante
    la cookie `aurore_access` (token OAuth de Discord) enviada automáticamente
    por el navegador, o el header `Authorization: Bearer <token>`.

    Los endpoints de canal y config además requieren el header `x-internal-token`
    (token compartido entre el frontend Next.js y el bot).

servers:
  - url: https://aurore-bot.onrender.com
    description: Producción (Render)
  - url: http://localhost:3001
    description: Desarrollo local

tags:
  - name: Sistema
    description: Estado del servidor
  - name: Leaderboard
    description: Ranking global de XP
  - name: Guild Stats
    description: Estadísticas del servidor
  - name: Guild Leaderboard
    description: Ranking de XP del servidor
  - name: Usuarios
    description: Perfiles y búsqueda de usuarios
  - name: Moderación
    description: Registro de acciones de moderación
  - name: Sorteos
    description: Gestión de giveaways
  - name: Configuración
    description: Ajustes del servidor (requiere x-internal-token)

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: aurore_access
    bearerAuth:
      type: http
      scheme: bearer
    internalToken:
      type: apiKey
      in: header
      name: x-internal-token

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Unauthorized

    RateLimitError:
      type: object
      required: [error, retryAfter]
      properties:
        error:
          type: string
          example: Too many requests
        retryAfter:
          type: integer
          example: 45
          description: Segundos hasta que se reinicia la ventana

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: integer
          example: 1709500000000
        cache:
          type: object
          properties:
            size: { type: integer, example: 42 }
            max:  { type: integer, example: 2000 }

    LeaderboardEntry:
      type: object
      properties:
        rank:     { type: integer,  example: 1 }
        userId:   { type: string,   example: "1464318434849591336" }
        username: { type: string,   example: "aurore_admin" }
        level:    { type: integer,  example: 15 }
        xp:       { type: integer,  example: 72 }
        messages: { type: integer,  example: 1240 }
        xpForNext:{ type: integer,  example: 100 }

    ModBreakdownItem:
      type: object
      properties:
        type:  { type: string,  example: ban  }
        count: { type: integer, example: 12   }

    GuildStats:
      type: object
      properties:
        guildId:       { type: string,  example: "123456789012345678" }
        users:         { type: integer, example: 342 }
        totalXP:       { type: integer, example: 84200 }
        totalMessages: { type: integer, example: 29400 }
        modLogs:       { type: integer, example: 87 }
        topUser:
          type: object
          nullable: true
          properties:
            user_id:  { type: string,  example: "1464318434849591336" }
            username: { type: string,  example: "top_user" }
            level:    { type: integer, example: 20 }
            xp:       { type: integer, example: 50 }
        modBreakdown:
          type: array
          items: { $ref: '#/components/schemas/ModBreakdownItem' }

    UserProfile:
      type: object
      properties:
        guildId:    { type: string,  example: "123456789012345678" }
        userId:     { type: string,  example: "1464318434849591336" }
        username:   { type: string,  example: "aurore_user" }
        level:      { type: integer, example: 7 }
        xp:         { type: integer, example: 43 }
        messages:   { type: integer, example: 512 }
        rank:       { type: integer, example: 4 }
        xpForNext:  { type: integer, example: 100 }
        warnings:   { type: integer, example: 1 }
        modHistory:
          type: array
          items:
            type: object
            properties:
              type:         { type: string, example: warn }
              reason:       { type: string, example: "Spam en canales" }
              moderator_id: { type: string, example: "999900001111222233" }
              timestamp:    { type: integer, example: 1709500000000 }

    ModLog:
      type: object
      properties:
        id:           { type: integer, example: 42 }
        guild_id:     { type: string,  example: "123456789012345678" }
        type:         { type: string,  enum: [ban, kick, warn, timeout, mute, unmute, unban] }
        user_id:      { type: string,  example: "1464318434849591336" }
        moderator_id: { type: string,  example: "999900001111222233" }
        reason:       { type: string,  example: "Comportamiento inadecuado" }
        timestamp:    { type: integer, example: 1709500000000 }

    Giveaway:
      type: object
      properties:
        id:           { type: integer, example: 1 }
        guild_id:     { type: string,  example: "123456789012345678" }
        channel_id:   { type: string,  example: "444433332222111100" }
        message_id:   { type: string,  example: "987654321098765432" }
        prize:        { type: string,  example: "Discord Nitro x1" }
        ends_at:      { type: integer, example: 1709503600 }
        active:       { type: integer, enum: [0, 1], example: 1 }
        winner_id:    { type: string,  nullable: true, example: null }
        participants: { type: integer, example: 27 }

    GuildConfig:
      type: object
      properties:
        guild_id:        { type: string, example: "123456789012345678" }
        level_channel:   { type: string, nullable: true, example: "444433332222111100" }
        log_channel:     { type: string, nullable: true, example: null }
        welcome_channel: { type: string, nullable: true, example: null }
        levelRoles:
          type: array
          items:
            type: object
            properties:
              level:   { type: integer, example: 5 }
              role_id: { type: string,  example: "555544443333222211" }

  parameters:
    guildId:
      name: guildId
      in: path
      required: true
      schema: { type: string, pattern: '^\d{17,20}$' }
      example: "123456789012345678"
    userId:
      name: userId
      in: path
      required: true
      schema: { type: string, pattern: '^\d{17,20}$' }
      example: "1464318434849591336"
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "Unauthorized" }
    Forbidden:
      description: Sin permisos suficientes en el servidor
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "Forbidden: requires Administrator permission" }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Parámetro inválido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimit:
      description: Demasiadas solicitudes
      headers:
        Retry-After:
          schema: { type: integer }
          description: Segundos hasta siguiente ventana
        X-RateLimit-Limit:
          schema: { type: integer }
        X-RateLimit-Remaining:
          schema: { type: integer }
        X-RateLimit-Reset:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RateLimitError' }

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Estado del servidor
      security: []
      responses:
        '200':
          description: Servidor operativo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /api/leaderboard:
    get:
      tags: [Leaderboard]
      summary: Ranking global de XP (todos los servidores)
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Lista paginada del ranking global
          content:
            application/json:
              schema:
                type: object
                properties:
                  leaderboard:
                    type: array
                    items: { $ref: '#/components/schemas/LeaderboardEntry' }
                  total:  { type: integer, example: 1500 }
                  limit:  { type: integer, example: 10 }
                  offset: { type: integer, example: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimit' }

  /api/guild/{guildId}/stats:
    get:
      tags: [Guild Stats]
      summary: Estadísticas del servidor
      parameters:
        - $ref: '#/components/parameters/guildId'
      responses:
        '200':
          description: Estadísticas completas del servidor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuildStats' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/guild/{guildId}/leaderboard:
    get:
      tags: [Guild Leaderboard]
      summary: Ranking de XP del servidor
      parameters:
        - $ref: '#/components/parameters/guildId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Leaderboard paginado del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  leaderboard:
                    type: array
                    items: { $ref: '#/components/schemas/LeaderboardEntry' }
                  total:  { type: integer }
                  limit:  { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/guild/{guildId}/users/search:
    get:
      tags: [Usuarios]
      summary: Búsqueda avanzada de usuarios en el servidor
      parameters:
        - $ref: '#/components/parameters/guildId'
        - name: q
          in: query
          description: Nombre de usuario o ID exacto
          schema: { type: string, maxLength: 100 }
        - name: minLevel
          in: query
          schema: { type: integer, minimum: 0 }
        - name: maxLevel
          in: query
          schema: { type: integer, maximum: 9999 }
        - name: sort
          in: query
          schema: { type: string, enum: [level, xp, messages], default: level }
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Lista de usuarios que coinciden
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/LeaderboardEntry' }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimit' }

  /api/guild/{guildId}/user/{userId}/profile:
    get:
      tags: [Usuarios]
      summary: Perfil completo de un usuario
      parameters:
        - $ref: '#/components/parameters/guildId'
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: Perfil del usuario con historial de moderación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/guild/{guildId}/mod-logs:
    get:
      tags: [Moderación]
      summary: Registro de acciones de moderación
      parameters:
        - $ref: '#/components/parameters/guildId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: type
          in: query
          description: Filtrar por tipo de acción
          schema: { type: string, enum: [ban, kick, warn, timeout, mute, unmute, unban] }
        - name: search
          in: query
          description: ID exacto de usuario o moderador (snowflake)
          schema: { type: string, pattern: '^\d{17,20}$' }
      responses:
        '200':
          description: Lista paginada de logs con breakdown por tipo
          content:
            application/json:
              schema:
                type: object
                properties:
                  guildId: { type: string }
                  logs:
                    type: array
                    items: { $ref: '#/components/schemas/ModLog' }
                  total:     { type: integer }
                  breakdown:
                    type: array
                    items: { $ref: '#/components/schemas/ModBreakdownItem' }
                  limit:  { type: integer }
                  offset: { type: integer }
        '400':
          description: type o search inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalidType:
                  value: { error: "Invalid type filter" }
                invalidSearch:
                  value: { error: "Invalid search ID" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/guild/{guildId}/giveaways:
    get:
      tags: [Sorteos]
      summary: Lista de sorteos del servidor
      parameters:
        - $ref: '#/components/parameters/guildId'
        - name: status
          in: query
          schema: { type: string, enum: [active, ended] }
          description: Sin valor devuelve todos
      responses:
        '200':
          description: Lista de sorteos con conteo de participantes
          content:
            application/json:
              schema:
                type: object
                properties:
                  guildId:   { type: string }
                  giveaways:
                    type: array
                    items: { $ref: '#/components/schemas/Giveaway' }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/guild/{guildId}/config:
    get:
      tags: [Configuración]
      summary: Configuración actual del servidor
      description: Requiere x-internal-token además de sesión de usuario.
      security:
        - cookieAuth: []
          internalToken: []
      parameters:
        - $ref: '#/components/parameters/guildId'
      responses:
        '200':
          description: Configuración del servidor con roles de nivel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuildConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    patch:
      tags: [Configuración]
      summary: Actualizar canales del servidor
      description: |
        Requiere x-internal-token. Solo se actualizan los campos presentes en el body.
        Enviar `null` o `""` borra el canal configurado.
      security:
        - cookieAuth: []
          internalToken: []
      parameters:
        - $ref: '#/components/parameters/guildId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                level_channel:
                  type: string
                  nullable: true
                  pattern: '^\d{17,20}$'
                  example: "444433332222111100"
                log_channel:
                  type: string
                  nullable: true
                  pattern: '^\d{17,20}$'
                  example: null
                welcome_channel:
                  type: string
                  nullable: true
                  pattern: '^\d{17,20}$'
                  example: "444433332222111100"
      responses:
        '200':
          description: Configuración actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuildConfig' }
        '400':
          description: Channel ID inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "Invalid level_channel: must be a valid channel ID or null" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimit' }

  /api/guild/{guildId}/channels:
    get:
      tags: [Configuración]
      summary: Lista de canales de texto del servidor
      description: Requiere x-internal-token. El bot debe estar en el servidor.
      security:
        - cookieAuth: []
          internalToken: []
      parameters:
        - $ref: '#/components/parameters/guildId'
      responses:
        '200':
          description: Lista de canales de texto ordenados alfabéticamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items:
                      type: object
                      properties:
                        id:         { type: string,  example: "444433332222111100" }
                        name:       { type: string,  example: "general" }
                        parentName: { type: string,  nullable: true, example: "Texto" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El bot no está en el servidor o la caché de Discord no incluye este servidor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
