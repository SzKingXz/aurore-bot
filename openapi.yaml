openapi: "3.1.0"
info:
  title: AURORE API
  version: "2.0.0"
  description: |
    API REST del bot AURORE. Todos los endpoints requieren autenticación via
    cookie `aurore_access` (token Discord OAuth) o header `Authorization: Bearer <token>`.
    Los endpoints marcados como **Internal** requieren adicionalmente el header
    `x-internal-token` con el valor configurado en `INTERNAL_TOKEN`.
  contact:
    name: AURORE System

servers:
  - url: http://localhost:3001
    description: Desarrollo local
  - url: https://aurore-bot.onrender.com
    description: Producción (Render)

tags:
  - name: System
    description: Health y estadísticas globales del bot
  - name: Guild
    description: Datos de un servidor específico (requieren admin)
  - name: Moderation
    description: Logs y acciones de moderación (requieren mod o admin)
  - name: Config
    description: Configuración del servidor (internal only)

paths:
  /health:
    get:
      tags: [System]
      summary: Estado del servidor
      description: Retorna el estado del servidor y estadísticas de caché. No requiere autenticación.
      responses:
        "200":
          description: Servidor operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:    { type: string, example: "ok" }
                  cache:
                    type: object
                    properties:
                      size: { type: integer, example: 42 }
                      max:  { type: integer, example: 2000 }
                  timestamp: { type: integer, example: 1709000000000 }

  /api/bot/stats:
    get:
      tags: [System]
      summary: Estadísticas globales del bot
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Estadísticas de la instancia del bot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStats"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/leaderboard:
    get:
      tags: [System]
      summary: Leaderboard global (todos los guilds)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Lista paginada de usuarios ordenados por nivel y XP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimit" }

  /api/guild/{guildId}/stats:
    get:
      tags: [Guild]
      summary: Estadísticas de un servidor
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/GuildId" }
      responses:
        "200":
          description: Estadísticas del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuildStats"
        "400": { $ref: "#/components/responses/InvalidSnowflake" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/guild/{guildId}/leaderboard:
    get:
      tags: [Guild]
      summary: Leaderboard de un servidor
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/GuildId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Lista paginada de usuarios del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"
        "400": { $ref: "#/components/responses/InvalidSnowflake" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/guild/{guildId}/users/search:
    get:
      tags: [Guild]
      summary: Búsqueda avanzada de usuarios
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/GuildId" }
        - name: q
          in: query
          description: Nombre de usuario o ID exacto (mín. 2 caracteres)
          schema: { type: string, maxLength: 100 }
        - name: minLevel
          in: query
          schema: { type: integer, minimum: 0, maximum: 9999 }
        - name: maxLevel
          in: query
          schema: { type: integer, minimum: 0, maximum: 9999 }
        - name: sort
          in: query
          schema: { type: string, enum: [level, xp, messages], default: level }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 30 }
      responses:
        "200":
          description: Resultados de la búsqueda
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/UserEntry" }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/InvalidSnowflake" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimit" }

  /api/guild/{guildId}/user/{userId}/profile:
    get:
      tags: [Guild]
      summary: Perfil completo de un usuario
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/GuildId" }
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "200":
          description: Perfil del usuario con historial de moderación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400": { $ref: "#/components/responses/InvalidSnowflake" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Usuario no encontrado en este servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "User not found" }

  /api/guild/{guildId}/mod-logs:
    get:
      tags: [Moderation]
      summary: Registros de moderación del servidor
      description: Requiere permisos de moderación (Kick Members, Ban Members) o Administrador.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/GuildId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
        - name: type
          in: query
          description: Filtrar por tipo de acción
          schema:
            type: string
            enum: [ban, kick, warn, timeout, mute, unmute, unban]
        - name: search
          in: query
          description: ID de usuario o moderador (snowflake exacto)
          schema: { type: string, pattern: "^\\d{17,20}$" }
      responses:
        "200":
          description: Lista de logs paginada con breakdown por tipo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModLogsResponse"
        "400":
          description: Tipo de acción inválido o search no es un snowflake
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Invalid type filter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/guild/{guildId}/giveaways:
    get:
      tags: [Guild]
      summary: Sorteos del servidor
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/GuildId" }
        - name: status
          in: query
          schema: { type: string, enum: [active, ended] }
          description: Omitir para obtener todos
      responses:
        "200":
          description: Lista de sorteos con conteo de participantes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiveawaysResponse"
        "400":
          description: Status inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/guild/{guildId}/config:
    get:
      tags: [Config]
      summary: Configuración del servidor (Internal)
      description: "**Solo accesible internamente.** Requiere header `x-internal-token`."
      security: [{ internalToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/GuildId" }
      responses:
        "200":
          description: Configuración del servidor incluyendo level roles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuildConfig" }
        "403": { $ref: "#/components/responses/Forbidden" }

    patch:
      tags: [Config]
      summary: Actualizar configuración del servidor (Internal)
      description: "**Solo accesible internamente.** Acepta `null` o `\"\"` para borrar un canal."
      security: [{ internalToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/GuildId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                level_channel:   { type: string, nullable: true, pattern: "^\\d{17,20}$", example: "1234567890123456789" }
                log_channel:     { type: string, nullable: true, pattern: "^\\d{17,20}$" }
                welcome_channel: { type: string, nullable: true, pattern: "^\\d{17,20}$" }
            examples:
              set_channel:
                value: { level_channel: "1234567890123456789" }
              clear_channel:
                value: { level_channel: null }
              full_config:
                value: { level_channel: "111", log_channel: "222", welcome_channel: "333" }
      responses:
        "200":
          description: Configuración actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuildConfig" }
        "400":
          description: Channel ID inválido o campo no permitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Invalid level_channel: must be a valid channel ID or null" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/guild/{guildId}/channels:
    get:
      tags: [Config]
      summary: Canales de texto del servidor (Internal)
      description: Retorna solo canales de texto (type=0). El bot debe estar en el servidor.
      security: [{ internalToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/GuildId" }
      responses:
        "200":
          description: Lista de canales ordenados alfabéticamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items:
                      type: object
                      properties:
                        id:         { type: string }
                        name:       { type: string }
                        parentName: { type: string, nullable: true }
        "404":
          description: El bot no está en el servidor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token Discord OAuth almacenado en cookie `aurore_access`
    internalToken:
      type: apiKey
      in: header
      name: x-internal-token
      description: Token interno compartido entre frontend y bot

  parameters:
    GuildId:
      name: guildId
      in: path
      required: true
      description: Discord snowflake ID del servidor (17-20 dígitos)
      schema: { type: string, pattern: "^\\d{17,20}$", example: "1234567890123456789" }
    UserId:
      name: userId
      in: path
      required: true
      description: Discord snowflake ID del usuario
      schema: { type: string, pattern: "^\\d{17,20}$", example: "9876543210987654321" }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    Unauthorized:
      description: No hay sesión activa o el token ha expirado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Unauthorized" }
    Forbidden:
      description: Sin permisos de administrador o moderación en el servidor
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Forbidden: requires Administrator permission" }
    InvalidSnowflake:
      description: El ID proporcionado no es un snowflake válido de Discord
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Invalid guildId: must be a valid Discord snowflake ID" }
    RateLimit:
      description: Demasiadas peticiones — espera el tiempo indicado en Retry-After
      headers:
        Retry-After:
          schema: { type: integer }
          description: Segundos hasta que el límite se reinicia
        X-RateLimit-Limit:
          schema: { type: integer }
        X-RateLimit-Remaining:
          schema: { type: integer }
        X-RateLimit-Reset:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Too many requests", retryAfter: 45 }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    BotStats:
      type: object
      properties:
        guilds:     { type: integer, description: "Servidores con usuarios registrados" }
        users:      { type: integer, description: "Usuarios únicos con XP" }
        modActions: { type: integer, description: "Acciones de moderación totales" }
        giveaways:  { type: integer, description: "Sorteos creados" }
        wsLatency:  { type: integer, nullable: true, description: "Latencia WebSocket con Discord en ms" }
        uptime:     { type: number,  description: "Segundos que lleva activo el proceso" }
        memoryMB:   { type: integer, description: "Memoria heap usada en MB" }
        timestamp:  { type: integer, description: "Unix timestamp en ms" }

    UserEntry:
      type: object
      properties:
        rank:     { type: integer }
        userId:   { type: string }
        username: { type: string }
        level:    { type: integer }
        xp:       { type: integer }
        messages: { type: integer }
        xpForNext:{ type: integer, description: "XP necesario para el siguiente nivel" }

    LeaderboardResponse:
      type: object
      properties:
        leaderboard:
          type: array
          items: { $ref: "#/components/schemas/UserEntry" }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    UserProfile:
      allOf:
        - $ref: "#/components/schemas/UserEntry"
        - type: object
          properties:
            guildId:   { type: string }
            warnings:  { type: integer }
            modHistory:
              type: array
              items:
                type: object
                properties:
                  type:         { type: string, enum: [ban, kick, warn, timeout, mute, unmute, unban] }
                  reason:       { type: string, nullable: true }
                  moderator_id: { type: string, nullable: true }
                  timestamp:    { type: integer }

    GuildStats:
      type: object
      properties:
        guildId:       { type: string }
        users:         { type: integer }
        totalXP:       { type: integer }
        totalMessages: { type: integer }
        modLogs:       { type: integer }
        topUser:       { $ref: "#/components/schemas/UserEntry", nullable: true }
        modBreakdown:
          type: array
          items:
            type: object
            properties:
              type:  { type: string }
              count: { type: integer }

    ModLog:
      type: object
      properties:
        id:           { type: integer }
        guild_id:     { type: string }
        type:         { type: string, enum: [ban, kick, warn, timeout, mute, unmute, unban] }
        user_id:      { type: string, nullable: true }
        moderator_id: { type: string, nullable: true }
        reason:       { type: string, nullable: true }
        timestamp:    { type: integer }

    ModLogsResponse:
      type: object
      properties:
        guildId:  { type: string }
        logs:     { type: array, items: { $ref: "#/components/schemas/ModLog" } }
        total:    { type: integer }
        limit:    { type: integer }
        offset:   { type: integer }
        breakdown:
          type: array
          items:
            type: object
            properties:
              type:  { type: string }
              count: { type: integer }

    Giveaway:
      type: object
      properties:
        id:           { type: integer }
        guild_id:     { type: string }
        channel_id:   { type: string, nullable: true }
        message_id:   { type: string, nullable: true }
        prize:        { type: string }
        ends_at:      { type: integer, nullable: true, description: "Unix timestamp en segundos" }
        active:       { type: integer, enum: [0, 1] }
        winner_id:    { type: string, nullable: true }
        participants: { type: integer, description: "Número de entradas" }

    GiveawaysResponse:
      type: object
      properties:
        guildId:   { type: string }
        giveaways: { type: array, items: { $ref: "#/components/schemas/Giveaway" } }
        total:     { type: integer }

    GuildConfig:
      type: object
      properties:
        guild_id:        { type: string }
        level_channel:   { type: string, nullable: true }
        log_channel:     { type: string, nullable: true }
        welcome_channel: { type: string, nullable: true }
        levelRoles:
          type: array
          items:
            type: object
            properties:
              level:   { type: integer }
              role_id: { type: string }
