services:
  - type: web
    name: aurore-bot
    runtime: node
    buildCommand: npm install
    startCommand: node bot.js
    envVars:
      - key: TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PORT
        value: 3001
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: aurore-db
      mountPath: /opt/render/project/src
      sizeGB: 1
